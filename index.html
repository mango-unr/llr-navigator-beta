  const all = [...llr.map(r=>({...r,_source:"LLR Shared Directory"})), ...local.filter(r=>r.status==="verified").map(r=>({...r,_source:"Local Organisation Directory"}))];
  const ctx = context ? `\n\nCONTEXT ALREADY GATHERED:\n${Object.entries(context).map(([k,v])=>`- ${k}: ${v}`).join("\n")}\n\nUse this context to make targeted, relevant recommendations immediately. Do not re-ask these questions.` : "";
  return `You are a compassionate, warm, and knowledgeable wellbeing support navigator for volunteers and SENDCOs in Leicestershire, UK.${ctx}

You are NOT a clinical tool. Never use words like "diagnose", "treat", or "symptoms". Focus on "resilience", "wellbeing support", "early help", and "signposting".

Recommend 1–3 resources from the list below that best fit the situation. Consider conditions, services, age groups, area, and referral type. Always explain WHY you are recommending each one. Note whether a professional referral is required. End by reminding the user that for clinical concerns, a GP or CAMHS referral may be appropriate.

AVAILABLE RESOURCES:
${all.map(r=>`- ${r.name} [${r._source}] (${r.category}, ${r.area}): ${r.desc}. Conditions: ${(r.conditions||[]).join(", ")}. Services: ${(Array.isArray(r.services)?r.services:[r.services]).join(", ")}. Age groups: ${(r.ageGroups||[]).join(", ")}. Referral: ${r.referral}. Phone: ${r.phone||"N/A"}. Email: ${r.email||"N/A"}. Website: ${r.website}.`).join("\n")}

Keep responses under 250 words. After each recommended resource, include on a new line:
📞 [phone] · ✉️ [email if available] · 🌐 [website as markdown link]
Omit unavailable contact types. Write naturally and warmly — no excessive bullet points.`;
}

function renderMd(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" style="color:'+B.green+';text-decoration:underline;" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(?<!href=")(https?:\/\/[^\s<"]+)/g,'<a href="$1" style="color:'+B.green+';text-decoration:underline;" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\n/g,"<br/>");
}

function isStale(dateStr) {
  if (!dateStr) return true;
  const d = new Date(dateStr);
  const sixMonths = new Date(); sixMonths.setMonth(sixMonths.getMonth()-6);
  return d < sixMonths;
}

function Btn({ children, onClick, variant="primary", size="md", style={} }) {
  const base = { cursor:"pointer", borderRadius:8, fontWeight:600, border:"none", transition:"all 0.15s", display:"inline-flex", alignItems:"center", gap:6 };
  const variants = {
    primary:  { background:B.green, color:B.white, boxShadow:"0 2px 8px rgba(58,184,122,0.3)" },
    secondary:{ background:B.white, color:B.greenDark, border:`1.5px solid ${B.green}` },
    amber:    { background:B.amber, color:B.white, boxShadow:"0 2px 8px rgba(244,168,48,0.3)" },
    ghost:    { background:"transparent", color:B.grey600, border:`1px solid ${B.grey200}` },
    danger:   { background:B.redLight, color:B.red, border:`1px solid #FCA5A5` },
  };
  const sizes = { sm:{ fontSize:12, padding:"5px 12px" }, md:{ fontSize:14, padding:"8px 18px" }, lg:{ fontSize:15, padding:"11px 24px" } };
  return <button onClick={onClick} style={{...base,...variants[variant],...sizes[size],...style}}>{children}</button>;
}

function ResourceForm({ onSave, onCancel, title, subtitle }) {

  const [errors, setErrors] = React.useState({});
  const [svcInput, setSvcInput] = React.useState("");
  function validate() {
    const e={};
    if(!form.name.trim()) e.name="Required";
    if(!form.area.trim()) e.area="Required";
    if(!form.desc.trim()) e.desc="Required";
    if(!form.website.trim()) e.website="Required";
    return e;
  }
  function toggle(key,val){ setForm(f=>({...f,[key]:f[key].includes(val)?f[key].filter(x=>x!==val):[...f[key],val]})); }
  function addSvc(){ if(!svcInput.trim())return; setForm(f=>({...f,services:[...f.services,svcInput.trim()]})); setSvcInput(""); }
  function handleSave(){ const e=validate(); if(Object.keys(e).length){setErrors(e);return;} onSave({...form}); }
  const inp=(label,key,ph,req)=>(
    <div style={{ marginBottom:12 }}>
      <label style={{ display:"block", fontSize:12, color:B.grey600, marginBottom:4, fontWeight:600 }}>{label}{req&&<span style={{color:B.red}}> *</span>}</label>
      <input value={form[key]} onChange={e=>{setForm(f=>({...f,[key]:e.target.value}));setErrors(er=>({...er,[key]:null}));}} placeholder={ph} style={{ width:"100%", fontSize:13, padding:"8px 12px", borderRadius:8, border:`1.5px solid ${errors[key]?B.red:B.grey200}`, boxSizing:"border-box", outline:"none" }} />
      {errors[key]&&<p style={{ margin:"3px 0 0", fontSize:12, color:B.red }}>{errors[key]}</p>}
    </div>
  );
  return (
    <div style={{ background:B.white, border:`1.5px solid ${B.grey200}`, borderRadius:12, padding:"1.25rem", marginBottom:"1rem", boxShadow:"0 2px 8px rgba(0,0,0,0.06)" }}>
      <p style={{ margin:"0 0 4px", fontWeight:700, fontSize:15, color:B.grey800 }}>{title}</p>
      {subtitle&&<p style={{ margin:"0 0 1rem", fontSize:13, color:B.grey600 }}>{subtitle}</p>}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 16px" }}>{inp("Name","name","e.g. LLR Mind",true)}{inp("Area","area","e.g. Leicester City",true)}</div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 16px", marginBottom:12 }}>
        <div><label style={{ display:"block", fontSize:12, color:B.grey600, marginBottom:4, fontWeight:600 }}>Category</label><select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))} style={{ width:"100%", fontSize:13, padding:"8px 12px", borderRadius:8, border:`1.5px solid ${B.grey200}` }}>{CATEGORIES.map(c=><option key={c}>{c}</option>)}</select></div>
        <div><label style={{ display:"block", fontSize:12, color:B.grey600, marginBottom:4, fontWeight:600 }}>Referral type</label><select value={form.referral} onChange={e=>setForm(f=>({...f,referral:e.target.value}))} style={{ width:"100%", fontSize:13, padding:"8px 12px", borderRadius:8, border:`1.5px solid ${B.grey200}` }}>{REFERRAL_OPTIONS.map(r=><option key={r}>{r}</option>)}</select></div>
      </div>
      <div style={{ marginBottom:12 }}><label style={{ display:"block", fontSize:12, color:B.grey600, marginBottom:6, fontWeight:600 }}>Conditions supported</label><div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>{CONDITION_OPTIONS.map(c=><button key={c} onClick={()=>toggle("conditions",c)} style={{ fontSize:12, padding:"4px 10px", borderRadius:20, border:`1.5px solid ${form.conditions.includes(c)?B.green:B.grey200}`, cursor:"pointer", background:form.conditions.includes(c)?B.greenLight:B.white, color:form.conditions.includes(c)?B.greenDark:B.grey600, fontWeight:form.conditions.includes(c)?600:400 }}>{c}</button>)}</div></div>
      <div style={{ marginBottom:12 }}><label style={{ display:"block", fontSize:12, color:B.grey600, marginBottom:4, fontWeight:600 }}>Services provided</label><div style={{ display:"flex", gap:8, marginBottom:6 }}><input value={svcInput} onChange={e=>setSvcInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addSvc()} placeholder="e.g. Counselling" style={{ flex:1, fontSize:13, padding:"8px 12px", borderRadius:8, border:`1.5px solid ${B.grey200}` }}/><Btn size="sm" variant="secondary" onClick={addSvc}>+ Add</Btn></div><div style={{ display:"flex", flexWrap:"wrap", gap:4 }}>{form.services.map(s=><span key={s} style={{ fontSize:12, padding:"3px 10px", borderRadius:20, background:B.greenLight, color:B.greenDark, display:"flex", alignItems:"center", gap:4 }}>{s}<span onClick={()=>setForm(f=>({...f,services:f.services.filter(x=>x!==s)}))} style={{ cursor:"pointer", opacity:0.6 }}>×</span></span>)}</div></div>
      <div style={{ marginBottom:12 }}><label style={{ display:"block", fontSize:12, color:B.grey600, marginBottom:6, fontWeight:600 }}>Age groups</label><div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>{AGE_GROUP_OPTIONS.map(a=><button key={a} onClick={()=>toggle("ageGroups",a)} style={{ fontSize:12, padding:"4px 10px", borderRadius:20, border:`1.5px solid ${form.ageGroups.includes(a)?B.amber:B.grey200}`, cursor:"pointer", background:form.ageGroups.includes(a)?B.amberLight:B.white, color:form.ageGroups.includes(a)?"#8A5C00":B.grey600, fontWeight:form.ageGroups.includes(a)?600:400 }}>{a}</button>)}</div></div>

      {inp("Description","desc","Brief description of what the organisation does",true)}
      <div style={{ display:"flex", gap:8 }}><Btn onClick={handleSave} variant="primary">Save resource</Btn><Btn onClick={onCancel} variant="ghost">Cancel</Btn></div>
    </div>
  );
}

function App() {

  const [showRecForm, setShowRecForm] = React.useState(false);

  const [recForm, setRecForm] = React.useState(BLANK);
  const [searchQ, setSearchQ] = React.useState("");
  const [filterCat, setFilterCat] = React.useState("All");
  const [filterAge, setFilterAge] = React.useState("All");
  const [filterRef, setFilterRef] = React.useState("All");
  const [adminMode, setAdminMode] = React.useState(false);
  const [adminPin, setAdminPin] = React.useState("");
  const [showAdminPrompt, setShowAdminPrompt] = React.useState(false);
  const [importPreview, setImportPreview] = React.useState(null);
  const bottomRef = React.useRef(null);
  const fileRef = React.useRef(null);

  const ADMIN_PIN = "sot2025";

  React.useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:"smooth"}); },[messages,loading]);

  React.useEffect(()=>{
    try {
      const r = storage.get("resource-ratings");
      if(r) setRatings(JSON.parse(r.value));
    } catch {}
    try {
      const l = storage.get("local-resources");
      if(l) setLocalRes(JSON.parse(l.value));
    } catch {}
  },[]);

  function saveRating(id, stars){
    const updated={...ratings,[id]:{ count:((ratings[id]?.count)||0)+1, total:((ratings[id]?.total)||0)+stars }};
    setRatings(updated);
    storage.set("resource-ratings", JSON.stringify(updated));
  }

  function saveLocalRes(res){
    storage.set("local-resources", JSON.stringify(res));
  }

  function addLocalResource(r){
    const updated=[...localRes,{...r,id:`local-${Date.now()}`,status:"pending",lastVerified:new Date().toISOString().split("T")[0]}];
    setLocalRes(updated); saveLocalRes(updated); setShowForm(false);
  }

  function removeLocal(id){
    const updated=localRes.filter(r=>r.id!==id);
    setLocalRes(updated); saveLocalRes(updated);
  }

  function updateLocalStatus(id, status){
    const updated=localRes.map(r=>r.id===id?{...r,status,lastVerified:status==="verified"?new Date().toISOString().split("T")[0]:r.lastVerified}:r);
    setLocalRes(updated); saveLocalRes(updated);
  }

  function startChat(){
    setPreStep(0); setPreAnswers({}); setPreInput(""); setPreCtx(null); setMessages([]);
  }

  function handlePreAnswer(val){
    const q = PRE_QUESTIONS[preStep];
    const updated = {...preAnswers, [q.id]: val };
    setPreAnswers(updated);
    if(preStep < PRE_QUESTIONS.length-1){
      setPreStep(s=>s+1);
      setPreInput("");
    } else {
      const labels = {
        "Age of young person": updated.age,
        "Location": updated.area,
        "Main concern": updated.concern,
        "Who is seeking support": updated.who,
        "Professional referral available": updated.referral,
      };
      setPreCtx(labels);
      setPreStep(-1);
    }
  }

  async function send(text){
    const userMsg = text||input.trim();
    if(!userMsg) return;
    setInput("");
    const updated=[...messages,{role:"user",content:userMsg}];
    setMessages(updated); setLoading(true);
    try{
      const res=await fetch(FIREBASE_FUNCTION_URL, {
        method:"POST",
        headers:{ "Content-Type":"application/json", "x-proxy-secret": PROXY_SECRET },
        body:JSON.stringify({ system: buildSystemPrompt(llrRes,localRes,preCtx), messages: updated }),
      });
      const data=await res.json();
      const reply=data.content?.map(b=>b.text||"").join("")||"Sorry, I couldn't get a response.";
      setMessages([...updated,{role:"assistant",content:reply}]);
    }catch(err){
      setMessages([...updated,{role:"assistant",content:"Something went wrong. Please try again."}]);
    }
    setLoading(false);
  }

  function downloadTemplate(){
    const headers=["Name","Area","Category","Referral","Conditions","Services","Age Groups","Phone","Email","Website","Description"];
    const example=["Example Service","Leicester City","Mental Health","Self-referral","Anxiety,Depression","Counselling,Group therapy","Young people (11–17),Adults (18+)","0116 000 0000","info@example.org","https://example.org","Brief description here"];
    const csv=[headers,example].map(r=>r.map(v=>`"${v}"`).join(",")).join("\n");
    const blob=new Blob([csv],{type:"text/csv"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="LLR_Directory_Template.csv"; a.click();
    URL.revokeObjectURL(url);
  }

  function handleFileUpload(e){
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const text=ev.target.result;
      const lines=text.split("\n").filter(Boolean);
      if(lines.length<2){ alert("File appears empty."); return; }
      const headers=lines[0].split(",").map(h=>h.replace(/"/g,"").trim());
      const rows=lines.slice(1).map(line=>{
        const vals=line.match(/(".*?"|[^,]+)/g)||[];
        const obj={};
        headers.forEach((h,i)=>{ obj[h]=(vals[i]||"").replace(/"/g,"").trim(); });
        return obj;
      }).filter(r=>r.Name);
      const parsed=rows.map(r=>({
        name:r.Name||"", area:r.Area||"", category:r.Category||"Mental Health",
        referral:r.Referral||"Self-referral",
        conditions:r.Conditions?r.Conditions.split(",").map(s=>s.trim()):[],
        services:r.Services?r.Services.split(",").map(s=>s.trim()):[],
        ageGroups:r["Age Groups"]?r["Age Groups"].split(",").map(s=>s.trim()):[],
        phone:r.Phone||"", email:r.Email||"", website:r.Website||"", desc:r.Description||"",
        status:"pending", lastVerified:new Date().toISOString().split("T")[0],
      }));
      setImportPreview(parsed);
    };
    reader.readAsText(file);
    e.target.value="";
  }

  function confirmImport(){
    const updated=[...localRes,...importPreview.map((r,i)=>({...r,id:`local-import-${Date.now()}-${i}`}))];
    setLocalRes(updated); saveLocalRes(updated); setImportPreview(null);
  }

  const filtered=(tab)=>{
    const src=tab==="llr"?llrRes:localRes;
    return src.filter(r=>{
      const q=searchQ.toLowerCase();
      const matchQ=!q||r.name.toLowerCase().includes(q)||r.desc.toLowerCase().includes(q)||(r.conditions||[]).some(c=>c.toLowerCase().includes(q));
      const matchCat=filterCat==="All"||r.category===filterCat;
      const matchAge=filterAge==="All"||(r.ageGroups||[]).includes(filterAge);
      const matchRef=filterRef==="All"||r.referral===filterRef;
      return matchQ&&matchCat&&matchAge&&matchRef;
    });
  };

  const navItems=[{id:"chat",label:"💬 Chat"},{id:"directory",label:"📋 Directory"},{id:"library",label:"🔍 Browse"},{id:"insights",label:"📊 Insights"}];
  const currentPreQ = preStep >= 0 && preStep < PRE_QUESTIONS.length ? PRE_QUESTIONS[preStep] : null;
  const chatReady = preCtx !== null;

  return (
    <div style={{ fontFamily:"-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", maxWidth:760, margin:"0 auto", padding:"0.75rem 1rem 2rem" }}>

      {/* Header */}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:"1.25rem", padding:"1rem 1.25rem", background:`linear-gradient(135deg, ${B.greenDark} 0%, ${B.green} 100%)`, borderRadius:16, color:B.white, boxShadow:"0 4px 16px rgba(58,184,122,0.3)" }}>
        <div style={{ display:"flex", alignItems:"center", gap:12 }}>
          <div style={{ width:44, height:44, background:"rgba(255,255,255,0.15)", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
            <svg viewBox="0 0 100 100" width="32" height="32" fill="none">
              <ellipse cx="50" cy="38" rx="28" ry="26" fill="rgba(255,255,255,0.9)"/>
              <rect x="46" y="60" width="8" height="22" rx="4" fill="rgba(255,255,255,0.9)"/>
              <circle cx="35" cy="58" r="5" fill="rgba(255,255,255,0.7)"/>
              <path d="M30 58 Q25 53 31 49" stroke="rgba(255,255,255,0.7)" strokeWidth="2" fill="none"/>
            </svg>
          </div>
          <div>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <p style={{ margin:0, fontSize:18, fontWeight:800, letterSpacing:-0.3 }}>LLR Support Navigator</p>
              <span style={{ fontSize:10, fontWeight:800, padding:"2px 8px", borderRadius:20, background:"rgba(255,255,255,0.25)", color:B.white, letterSpacing:1, textTransform:"uppercase" }}>Beta</span>
            </div>
            <p style={{ margin:0, fontSize:12, opacity:0.85 }}>Shapes of Tomorrow · Leicestershire</p>
          </div>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
          {!adminMode&&<button onClick={()=>setShowAdminPrompt(true)} style={{ fontSize:11, padding:"4px 10px", borderRadius:20, background:"rgba(255,255,255,0.15)", border:"1px solid rgba(255,255,255,0.3)", color:B.white, cursor:"pointer" }}>Admin</button>}
          {adminMode&&<span style={{ fontSize:11, padding:"4px 10px", borderRadius:20, background:B.amber, color:B.white, fontWeight:700 }}>Admin Mode</span>}
        </div>
      </div>

      {/* Admin pin prompt */}
      {showAdminPrompt&&(
        <div style={{ background:B.white, border:`1.5px solid ${B.grey200}`, borderRadius:12, padding:"1rem", marginBottom:"1rem", boxShadow:"0 2px 8px rgba(0,0,0,0.08)" }}>
          <p style={{ margin:"0 0 8px", fontSize:14, fontWeight:600, color:B.grey800 }}>Enter admin PIN</p>
          <div style={{ display:"flex", gap:8 }}>
            <input type="password" value={adminPin} onChange={e=>setAdminPin(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter"){ if(adminPin===ADMIN_PIN){setAdminMode(true);setShowAdminPrompt(false);setAdminPin("");}else{alert("Incorrect PIN");} }}} placeholder="PIN" style={{ width:120, fontSize:14, padding:"8px 12px", borderRadius:8, border:`1.5px solid ${B.grey200}` }}/>
            <Btn variant="primary" size="sm" onClick={()=>{ if(adminPin===ADMIN_PIN){setAdminMode(true);setShowAdminPrompt(false);setAdminPin("");}else{alert("Incorrect PIN");} }}>Enter</Btn>
            <Btn variant="ghost" size="sm" onClick={()=>{setShowAdminPrompt(false);setAdminPin("");}}>Cancel</Btn>
          </div>
        </div>
      )}

      {/* Nav */}
      <div style={{ display:"flex", gap:6, marginBottom:"1.25rem", background:B.grey50, padding:4, borderRadius:12 }}>
        {navItems.map(n=>(
          <button key={n.id} onClick={()=>setView(n.id)} style={{ flex:1, fontSize:13, padding:"8px 4px", borderRadius:10, border:"none", cursor:"pointer", fontWeight:view===n.id?700:500, background:view===n.id?B.white:B.grey50, color:view===n.id?B.greenDark:B.grey600, boxShadow:view===n.id?"0 1px 4px rgba(0,0,0,0.1)":"none", transition:"all 0.15s" }}>{n.label}</button>
        ))}
      </div>

      {/* ── CHAT ── */}
      {view==="chat"&&(
        <div>
          {!chatReady&&currentPreQ!==null&&(
            <div>
              <div style={{ display:"flex", gap:4, marginBottom:"1rem" }}>
                {PRE_QUESTIONS.map((_,i)=><div key={i} style={{ flex:1, height:4, borderRadius:4, background:i<=preStep?B.green:B.grey200, transition:"background 0.3s" }}/>)}
              </div>
              <div style={{ background:B.white, border:`1.5px solid ${B.grey200}`, borderRadius:16, padding:"1.5rem", textAlign:"center", boxShadow:"0 2px 12px rgba(0,0,0,0.06)" }}>
                <p style={{ margin:"0 0 6px", fontSize:12, color:B.grey400, fontWeight:600, textTransform:"uppercase", letterSpacing:1 }}>Question {preStep+1} of {PRE_QUESTIONS.length}</p>
                <p style={{ margin:"0 0 1.25rem", fontSize:17, fontWeight:700, color:B.grey800 }}>{currentPreQ.q}</p>
                {currentPreQ.type==="choice"&&(
                  <div style={{ display:"flex", flexWrap:"wrap", gap:8, justifyContent:"center" }}>
                    {currentPreQ.choices.map(c=>(
                      <button key={c} onClick={()=>handlePreAnswer(c)} style={{ fontSize:13, padding:"10px 18px", borderRadius:24, border:`2px solid ${B.grey200}`, background:B.white, color:B.grey700, cursor:"pointer", fontWeight:500, transition:"all 0.15s" }}
                        onMouseEnter={e=>{e.target.style.borderColor=B.green;e.target.style.background=B.greenLight;e.target.style.color=B.greenDark;}}
                        onMouseLeave={e=>{e.target.style.borderColor=B.grey200;e.target.style.background=B.white;e.target.style.color=B.grey700;}}>{c}</button>
                    ))}
                  </div>
                )}
                {currentPreQ.type==="text"&&(
                  <div style={{ display:"flex", gap:8, justifyContent:"center" }}>
                    <input value={preInput} onChange={e=>setPreInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&preInput.trim()&&handlePreAnswer(preInput.trim())} placeholder={currentPreQ.placeholder} style={{ fontSize:14, padding:"10px 16px", borderRadius:10, border:`1.5px solid ${B.grey200}`, width:180, textAlign:"center" }}/>
                    <Btn variant="primary" onClick={()=>preInput.trim()&&handlePreAnswer(preInput.trim())}>Next →</Btn>
                  </div>
                )}
              </div>
              <p style={{ textAlign:"center", marginTop:"1rem" }}><button onClick={()=>{setPreCtx({});setPreStep(-1);}} style={{ fontSize:12, color:B.grey400, background:"none", border:"none", cursor:"pointer", textDecoration:"underline" }}>Skip and go straight to chat</button></p>
            </div>
          )}

          {chatReady&&(
            <div>
              {preCtx&&Object.keys(preCtx).length>0&&(
                <div style={{ background:B.greenLight, border:`1.5px solid ${B.greenMid}`, borderRadius:12, padding:"0.75rem 1rem", marginBottom:"0.75rem", display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12 }}>
                  <div>
                    <p style={{ margin:"0 0 4px", fontSize:12, fontWeight:700, color:B.greenDark, textTransform:"uppercase", letterSpacing:1 }}>Session context</p>
                    <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                      {Object.entries(preCtx).map(([k,v])=><span key={k} style={{ fontSize:12, background:B.white, color:B.greenDark, border:`1px solid ${B.greenMid}`, borderRadius:20, padding:"2px 10px" }}>{k}: <strong>{v}</strong></span>)}
                    </div>
                  </div>
                  <button onClick={startChat} style={{ fontSize:12, background:"none", border:"none", cursor:"pointer", color:B.grey400, whiteSpace:"nowrap", textDecoration:"underline" }}>New chat</button>
                </div>
              )}

              <div style={{ minHeight:300, maxHeight:420, overflowY:"auto", border:`1.5px solid ${B.grey200}`, borderRadius:12, padding:"1rem", marginBottom:"0.75rem", background:B.white }}>
                {messages.length===0&&(
                  <div style={{ textAlign:"center", padding:"1.5rem 0" }}>
                    <div style={{ fontSize:36, marginBottom:8 }}>🌱</div>
                    <p style={{ fontSize:15, color:B.grey600, margin:"0 0 1rem", fontWeight:500 }}>Ready to help find the right support.</p>
                    <p style={{ fontSize:13, color:B.grey400, margin:"0 0 1rem" }}>Describe the situation and I'll suggest the most relevant local resources.</p>
                  </div>
                )}
                {messages.map((m,i)=>(
                  <div key={i} style={{ marginBottom:"1rem", display:"flex", flexDirection:m.role==="user"?"row-reverse":"row", gap:8 }}>
                    {m.role==="assistant"&&<div style={{ width:28, height:28, borderRadius:"50%", background:`linear-gradient(135deg,${B.greenDark},${B.green})`, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, fontSize:12 }}>🌿</div>}
                    <div style={{ maxWidth:"82%", fontSize:14, lineHeight:1.7, padding:"10px 14px", borderRadius:m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px", background:m.role==="user"?`linear-gradient(135deg,${B.greenDark},${B.green})`:B.grey50, color:m.role==="user"?B.white:B.grey800, boxShadow:"0 1px 4px rgba(0,0,0,0.06)" }} dangerouslySetInnerHTML={{__html:renderMd(m.content)}}/>
                  </div>
                ))}
                {loading&&<div style={{ display:"flex", gap:8, alignItems:"center" }}><div style={{ width:28, height:28, borderRadius:"50%", background:`linear-gradient(135deg,${B.greenDark},${B.green})`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:12 }}>🌿</div><div style={{ padding:"10px 14px", borderRadius:12, background:B.grey50, color:B.grey400, fontSize:14 }}>Finding the right support…</div></div>}
                <div ref={bottomRef}/>
              </div>

              <div style={{ display:"flex", gap:8 }}>
                <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()} placeholder="Describe the situation…" style={{ flex:1, fontSize:14, padding:"11px 16px", borderRadius:10, border:`1.5px solid ${B.grey200}`, outline:"none", background:B.white }}/>
                <Btn variant="primary" onClick={()=>send()}>Send</Btn>
                {messages.length>0&&<Btn variant="ghost" onClick={startChat}>Clear</Btn>}
              </div>
              <p style={{ fontSize:11, color:B.grey400, marginTop:"0.75rem", lineHeight:1.5 }}>⚠️ This tool is a wellbeing signposting aid, not a clinical service. For urgent concerns, contact emergency services or a GP.</p>
            </div>
          )}

          {!chatReady&&currentPreQ===null&&preStep!==(-2)&&(
            <div style={{ textAlign:"center", padding:"2rem" }}>
              <div style={{ fontSize:40, marginBottom:12 }}>🌱</div>
              <p style={{ fontSize:16, fontWeight:700, color:B.grey800, margin:"0 0 8px" }}>Welcome to the LLR Support Navigator</p>
              <p style={{ fontSize:14, color:B.grey600, margin:"0 0 1.5rem" }}>We'll ask a few quick questions first to help us find the best match.</p>
              <Btn variant="primary" size="lg" onClick={startChat}>Get started</Btn>
            </div>
          )}
        </div>
      )}

      {/* ── DIRECTORY ── */}
      {view==="directory"&&(
        <div>
          <BetaBanner />

          <div style={{ background:B.white, border:`1.5px solid ${B.grey200}`, borderRadius:12, padding:"0.75rem 1rem", marginBottom:"1rem", display:"flex", flexWrap:"wrap", gap:8, alignItems:"center" }}>
            <input value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="🔍 Search by name, condition…" style={{ flex:1, minWidth:180, fontSize:13, padding:"7px 12px", borderRadius:8, border:`1.5px solid ${B.grey200}`, outline:"none" }}/>
            <select value={filterCat} onChange={e=>setFilterCat(e.target.value)} style={{ fontSize:13, padding:"7px 10px", borderRadius:8, border:`1.5px solid ${B.grey200}` }}><option value="All">All categories</option>{CATEGORIES.map(c=><option key={c}>{c}</option>)}</select>
            <select value={filterAge} onChange={e=>setFilterAge(e.target.value)} style={{ fontSize:13, padding:"7px 10px", borderRadius:8, border:`1.5px solid ${B.grey200}` }}><option value="All">All ages</option>{AGE_GROUP_OPTIONS.map(a=><option key={a}>{a}</option>)}</select>
            <select value={filterRef} onChange={e=>setFilterRef(e.target.value)} style={{ fontSize:13, padding:"7px 10px", borderRadius:8, border:`1.5px solid ${B.grey200}` }}><option value="All">Any referral</option>{REFERRAL_OPTIONS.map(r=><option key={r}>{r}</option>)}</select>
          </div>

          <div style={{ display:"flex", gap:6, marginBottom:"1rem", justifyContent:"space-between", alignItems:"center" }}>
            <div style={{ display:"flex", gap:6 }}>
              <button onClick={()=>setDirTab("llr")} style={{ fontSize:13, padding:"8px 18px", borderRadius:10, border:`2px solid ${dirTab==="llr"?B.green:B.grey200}`, cursor:"pointer", fontWeight:dirTab==="llr"?700:500, background:dirTab==="llr"?B.greenLight:B.white, color:dirTab==="llr"?B.greenDark:B.grey600 }}>🌍 LLR Shared ({filtered("llr").length})</button>
              <button onClick={()=>setDirTab("local")} style={{ fontSize:13, padding:"8px 18px", borderRadius:10, border:`2px solid ${dirTab==="local"?B.amber:B.grey200}`, cursor:"pointer", fontWeight:dirTab==="local"?700:500, background:dirTab==="local"?B.amberLight:B.white, color:dirTab==="local"?B.amber:B.grey600 }}>🏫 Local ({filtered("local").length})</button>
            </div>
            <div style={{ display:"flex", gap:6 }}>
              {dirTab==="llr"&&<Btn variant="secondary" size="sm" onClick={()=>{setShowRecForm(f=>!f);setRecSubmitted(false);setRecForm(BLANK);}}>+ Recommend</Btn>}
              {dirTab==="local"&&<><Btn variant="ghost" size="sm" onClick={downloadTemplate}>⬇ Template</Btn><Btn variant="ghost" size="sm" onClick={()=>fileRef.current?.click()}>⬆ Import CSV</Btn><Btn variant="amber" size="sm" onClick={()=>setShowForm(f=>!f)}>+ Add resource</Btn><input ref={fileRef} type="file" accept=".csv" style={{display:"none"}} onChange={handleFileUpload}/></>}
            </div>
          </div>

          {importPreview&&(
            <div style={{ background:B.amberLight, border:`1.5px solid ${B.amber}`, borderRadius:12, padding:"1rem", marginBottom:"1rem" }}>
              <p style={{ margin:"0 0 8px", fontWeight:700, fontSize:14, color:"#8A5C00" }}>Preview: {importPreview.length} resources to import</p>
              <div style={{ maxHeight:160, overflowY:"auto", marginBottom:10 }}>
                {importPreview.map((r,i)=><div key={i} style={{ fontSize:12, padding:"4px 0", borderBottom:`1px solid ${B.grey200}`, color:B.grey800 }}><strong>{r.name}</strong> — {r.area} · {r.category}</div>)}
              </div>
              <div style={{ display:"flex", gap:8 }}>
                <Btn variant="amber" size="sm" onClick={confirmImport}>Confirm import</Btn>
                <Btn variant="ghost" size="sm" onClick={()=>setImportPreview(null)}>Cancel</Btn>
              </div>
            </div>
          )}

          {dirTab==="llr"&&showRecForm&&!recSubmitted&&<ResourceForm title="Recommend a resource" subtitle="Suggest a resource for the Shapes of Tomorrow team to review." onSave={r=>{setRecForm(r);setRecSubmitted(true);}} onCancel={()=>setShowRecForm(false)}/>}
          {dirTab==="llr"&&showRecForm&&recSubmitted&&(
            <div style={{ background:B.greenLight, border:`1.5px solid ${B.greenMid}`, borderRadius:12, padding:"1rem", marginBottom:"1rem" }}>
              <p style={{ margin:"0 0 4px", fontWeight:700, fontSize:14, color:B.greenDark }}>✓ Thanks for your recommendation!</p>
              <p style={{ margin:"0 0 10px", fontSize:13, color:B.greenDark }}>Please email the details below to <strong>shapesoftomorrow@gmail.com</strong> for review.</p>
              <div style={{ background:B.white, borderRadius:8, padding:"0.75rem", fontSize:13, lineHeight:1.8, color:B.grey800 }}>
                <p style={{margin:0}}><strong>Name:</strong> {recForm.name} · <strong>Area:</strong> {recForm.area}</p>
                <p style={{margin:0}}><strong>Category:</strong> {recForm.category} · <strong>Referral:</strong> {recForm.referral}</p>
                <p style={{margin:0}}><strong>Phone:</strong> {recForm.phone||"N/A"} · <strong>Email:</strong> {recForm.email||"N/A"} · <strong>Website:</strong> {recForm.website}</p>
                <p style={{margin:0}}><strong>Conditions:</strong> {recForm.conditions?.join(", ")||"N/A"}</p>
                <p style={{margin:0}}><strong>Services:</strong> {recForm.services?.join(", ")||"N/A"}</p>
                <p style={{margin:0}}><strong>Age groups:</strong> {recForm.ageGroups?.join(", ")||"N/A"}</p>
                <p style={{margin:0}}><strong>Description:</strong> {recForm.desc}</p>
              </div>
              <div style={{marginTop:10}}><Btn variant="secondary" size="sm" onClick={()=>{setShowRecForm(false);setRecSubmitted(false);}}>Done</Btn></div>
            </div>
          )}

          {dirTab==="local"&&showForm&&<ResourceForm title="Add local resource" subtitle="This will be visible to your organisation and used by the AI navigator." onSave={addLocalResource} onCancel={()=>setShowForm(false)}/>}

          <div style={{ display:"grid", gap:10 }}>
            {dirTab==="llr"&&filtered("llr").map(r=>(
              <ResourceCard key={r.id} r={r} rating={ratings[r.id]} onRate={s=>saveRating(r.id,s)} isLocal={false} adminMode={adminMode}/>
            ))}
            {dirTab==="local"&&filtered("local").length===0&&!showForm&&!importPreview&&(
              <div style={{ textAlign:"center", padding:"2.5rem", color:B.grey400, background:B.grey50, borderRadius:12, border:`1.5px dashed ${B.grey200}` }}>
                <p style={{margin:"0 0 4px",fontSize:15}}>🏫 No local resources yet</p>
                <p style={{margin:0,fontSize:13}}>Add organisation-specific contacts or import from a spreadsheet.</p>
              </div>
            )}
            {dirTab==="local"&&filtered("local").map(r=>(
              <div key={r.id} style={{ position:"relative" }}>
                <ResourceCard r={r} rating={ratings[r.id]} onRate={s=>saveRating(r.id,s)} isLocal={true} adminMode={adminMode} onVerify={id=>updateLocalStatus(id,"verified")} onFlag={id=>updateLocalStatus(id,"flagged")}/>
                {adminMode&&<button onClick={()=>removeLocal(r.id)} style={{ position:"absolute", top:12, right:12, background:B.redLight, border:`1px solid #FCA5A5`, color:B.red, borderRadius:6, cursor:"pointer", fontSize:12, padding:"3px 8px" }}>Remove</button>}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── LIBRARY ── */}
      {view==="library"&&(
        <div>
          <p style={{ fontSize:14, color:B.grey600, marginTop:0 }}>Browse all resources by condition. No AI — just a direct view of what's available in LLR.</p>
          {CONDITION_OPTIONS.map(cond=>{
            const matches=[...llrRes,...localRes.filter(r=>r.status==="verified")].filter(r=>(r.conditions||[]).includes(cond));
            if(!matches.length) return null;
            return (
              <div key={cond} style={{ marginBottom:"1.5rem" }}>
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8 }}>
                  <h3 style={{ margin:0, fontSize:15, fontWeight:700, color:B.grey800 }}>{cond}</h3>
                  <span style={{ fontSize:12, background:B.greenLight, color:B.greenDark, borderRadius:20, padding:"2px 10px", fontWeight:600 }}>{matches.length} service{matches.length!==1?"s":""}</span>
                </div>
                <div style={{ display:"grid", gap:8 }}>
                  {matches.map(r=>(
                    <div key={r.id} style={{ background:B.white, border:`1.5px solid ${B.grey200}`, borderRadius:10, padding:"0.75rem 1rem", display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, flexWrap:"wrap" }}>
                      <div>
                        <p style={{ margin:"0 0 2px", fontWeight:600, fontSize:14, color:B.grey800 }}>{r.name}</p>
                        <p style={{ margin:0, fontSize:12, color:B.grey500 }}>{r.area} · {r.referral}</p>
                      </div>
                      <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
                        <Badge label={r.category} colors={CAT_COLORS[r.category]}/>
                        {r.phone&&<span style={{fontSize:12,color:B.grey600}}>📞 {r.phone}</span>}
                        {r.website&&<a href={r.website} style={{fontSize:12,color:B.green,fontWeight:600}} target="_blank" rel="noopener noreferrer">Visit →</a>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── INSIGHTS ── */}
      {view==="insights"&&(
        <div>
          <BetaBanner />
          <p style={{ fontSize:14, color:B.grey600, marginTop:0 }}>Ratings saved on this device. Cross-device aggregation coming soon.</p>
          {Object.keys(ratings).length===0?(
            <div style={{ textAlign:"center", padding:"2.5rem", background:B.grey50, borderRadius:12, border:`1.5px dashed ${B.grey200}`, color:B.grey400 }}>
              <p style={{margin:0,fontSize:15}}>📊 No ratings yet</p>
              <p style={{margin:"4px 0 0",fontSize:13}}>Ratings from directory cards will appear here.</p>
            </div>
          ):(
            <div style={{ display:"grid", gap:10 }}>
              {Object.entries(ratings).map(([id,r])=>{
                const res=[...llrRes,...localRes].find(x=>String(x.id)===id);
                if(!res) return null;
                const avg=r.count?r.total/r.count:0;
                return (
                  <div key={id} style={{ background:B.white, border:`1.5px solid ${B.grey200}`, borderRadius:12, padding:"0.75rem 1.1rem", display:"flex", alignItems:"center", gap:12 }}>
                    <div style={{ flex:1 }}>
                      <p style={{ margin:0, fontSize:14, fontWeight:600, color:B.grey800 }}>{res.name}</p>
                      <p style={{ margin:0, fontSize:12, color:B.grey400 }}>{r.count} rating{r.count!==1?"s":""}</p>
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                      {[1,2,3,4,5].map(n=><span key={n} style={{ fontSize:18, color:n<=Math.round(avg)?B.amber:B.grey200 }}>★</span>)}
                      <span style={{ fontSize:15, fontWeight:700, color:B.grey800, minWidth:28 }}>{avg.toFixed(1)}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
